# CI: the flake must evaluate and the nix sources must be clean.
# This is the required status check for main (dev-rules); it is also the
# only place the flake gets evaluated until a dev host has nix.
name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake:
    runs-on: ubuntu-latest
    # Evaluation reaches the network for niri's git dependencies, so without a
    # timeout a hung fetch would sit on the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: nix flake check
        run: nix flake check --print-build-logs

      # The lint steps report independently: a statix failure should not hide a
      # nixfmt one and cost a whole extra round trip to find out.
      - name: statix
        if: ${{ !cancelled() }}
        run: nix develop --command statix check .

      # -race because the journal is written from more than one goroutine, and
      # a data race there corrupts the file that says where you were.
      - name: go test + gofmt
        if: ${{ !cancelled() }}
        run: |
          nix develop --command go test -race ./...
          fmt=$(nix develop --command gofmt -l cmd internal)
          if [ -n "$fmt" ]; then echo "gofmt needed: $fmt"; exit 1; fi

      # nixfmt --check only names the offending file; formatting + diffing
      # prints the exact fix, which matters while no dev host has nix.
      - name: nixfmt
        if: ${{ !cancelled() }}
        run: |
          git ls-files -z '*.nix' | xargs -0 nix develop --command nixfmt
          git diff --exit-code
