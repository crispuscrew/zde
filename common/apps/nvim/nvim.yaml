# zde app: Neovim (LazyVim, multi-language). Schema v3, ZincContainer.
# Plugins/parsers/tools are baked at build time; the runtime is network-locked.
SchemaVersion: 3
Type: ZincContainer

AppNameID: nvim
Icon: nvim
Description: Neovim editor (LazyVim, multi-language)

StartConditions:
  Entrypoint: nvim
  Terminal: true

ResourcesMeta:
  MaxCPUCores: 4
  MaxRamMiB: 2048
  PIDsLimit: 1024

InternalUserMeta:
  UseNonRootUser: true
  NonRootUserName: dev
  KeepUserID: true

ImageMeta:
  # glibc base required: mason installs prebuilt glibc binaries (musl breaks them).
  Image: docker.io/library/debian@sha256:1def178129dfb5f24db43afbf2fcac04530012e3264ba4ff81c71184e17a9ee4
  Install:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - apt-get install -y --no-install-recommends
        ca-certificates curl git unzip xz-utils
        build-essential python3 python3-venv nodejs npm
        ripgrep fd-find
    # Debian's neovim is too old for LazyVim. Upstream publishes no checksum for
    # this asset, so the sha256 below is trust-on-first-use (pins reproducibility,
    # not authenticity); the build fails closed if the bytes ever differ.
    - curl -fsSL -o /tmp/nvim.tar.gz
        https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz
    - echo "a74740047e73b2b380d63a474282814063d10650cd6cc95efa16d1713c7e616c  /tmp/nvim.tar.gz" | sha256sum -c -
    - tar -C /opt -xzf /tmp/nvim.tar.gz
    - ln -s /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
    # The three steps below need the LazyVim config while the image is built.
    # Zinc 0.10 mounts the Configs files below at runtime, but still builds with
    # an empty context, so this app does not build as written: the sync steps run
    # against no config. Nothing in zde launches this definition yet either way.
    - runuser -u dev -- nvim --headless "+Lazy! sync" +qa
    - runuser -u dev -- nvim --headless "+TSUpdateSync" +qa
    - runuser -u dev -- nvim --headless "+MasonInstall gopls lua-language-server nixd bash-language-server basedpyright ruff clangd typescript-language-server html-lsp css-lsp marksman json-lsp yaml-language-server taplo dockerfile-language-server stylua shfmt shellcheck gofumpt goimports prettier clang-format markdownlint-cli2" +qa

DisplayMeta:
  DisableSecurityContext: false
  DisableGpuAccess: true

Configs:
  - { BundlePath: nvim/.gitignore, InnerMount: /home/dev/.config/nvim/.gitignore }
  - { BundlePath: nvim/init.lua, InnerMount: /home/dev/.config/nvim/init.lua }
  - { BundlePath: nvim/lua/config/autocmds.lua, InnerMount: /home/dev/.config/nvim/lua/config/autocmds.lua }
  - { BundlePath: nvim/lua/config/keymaps.lua, InnerMount: /home/dev/.config/nvim/lua/config/keymaps.lua }
  - { BundlePath: nvim/lua/config/lazy.lua, InnerMount: /home/dev/.config/nvim/lua/config/lazy.lua }
  - { BundlePath: nvim/lua/config/options.lua, InnerMount: /home/dev/.config/nvim/lua/config/options.lua }
  - { BundlePath: nvim/lua/plugins/editing.lua, InnerMount: /home/dev/.config/nvim/lua/plugins/editing.lua }
  - { BundlePath: nvim/lua/plugins/lsp.lua, InnerMount: /home/dev/.config/nvim/lua/plugins/lsp.lua }
  - { BundlePath: nvim/lua/plugins/markdown.lua, InnerMount: /home/dev/.config/nvim/lua/plugins/markdown.lua }
  - { BundlePath: nvim/lua/plugins/theme.lua, InnerMount: /home/dev/.config/nvim/lua/plugins/theme.lua }

# Code and state dirs are host paths of the invocation; attach them at runtime.
Volumes: []

HostTheme: true
